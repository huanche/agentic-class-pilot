name: classroom-generation-diagnostics

on:
  push:
    branches: [codex/classroom-generation-resume]
    paths: [.github/workflows/classroom-generation-diagnostics.yml]
  workflow_dispatch:
    inputs:
      classroom_id:
        description: Classroom to inspect (read only)
        default: z1u6w1DG7q
        required: true
      snapshot:
        description: Save the scoped classroom JSON for validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect classroom metadata and generation logs
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          CLASSROOM_ID: ${{ inputs.classroom_id || 'z1u6w1DG7q' }}
          SNAPSHOT: ${{ inputs.snapshot && 'true' || 'false' }}
        run: |
          set -euo pipefail
          [[ "$CLASSROOM_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          printf '%s\n' "$SERVER_SSH_KEY" > /tmp/generation_diagnostic_key
          chmod 600 /tmp/generation_diagnostic_key
          trap 'rm -f /tmp/generation_diagnostic_key' EXIT
          SSH=(ssh -i /tmp/generation_diagnostic_key -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new "ubuntu@$SERVER_HOST")
          "${SSH[@]}" "docker exec -i -e WRITE_SNAPSHOT='$SNAPSHOT' -e SNAPSHOT_TMP='/tmp/classroom-snapshot-$GITHUB_RUN_ID.json' agentic-teacher-prod node - '$CLASSROOM_ID'" <<'NODE'
          (async () => {
            const id = process.argv[2];
            const { Pool } = require('pg');
            const schema = process.env.COURSE_DATABASE_SCHEMA?.trim();
            if (schema && !/^[a-z_][a-z0-9_]*$/.test(schema)) throw new Error('Invalid schema');
            const pool = new Pool({connectionString:process.env.COURSE_DATABASE_URL||process.env.DATABASE_URL, connectionTimeoutMillis:10000, statement_timeout:10000, ...(schema?{options:'-c search_path='+schema}:{})});
            try {
              const result = await pool.query('SELECT stage, scenes, updated_at FROM mentra_classrooms WHERE id=$1', [id]);
              const c = result.rows[0];
              if (c && process.env.WRITE_SNAPSHOT === 'true')
                require('fs').writeFileSync(process.env.SNAPSHOT_TMP, JSON.stringify({stage:c.stage,scenes:c.scenes}));
              console.log(JSON.stringify({check:'classroom-metadata', found:!!c, defaultModel:process.env.DEFAULT_MODEL, updatedAt:c?.updated_at, name:c?.stage?.name, timing:c?.stage?.timing, generationModelPolicy:c?.stage?.generationModelPolicy, stageKeys:Object.keys(c?.stage??{}), scenes:c?.scenes?.map(s=>({order:s.order,id:s.id,title:s.title,type:s.type,timing:s.timing,speeches:s.actions?.filter(a=>a.type==='speech').length,servedAudio:s.actions?.filter(a=>a.type==='speech'&&a.audioUrl).length,invalidatedAudio:s.actions?.filter(a=>a.type==='speech'&&a.audioInvalidated).length}))}));
              const fs = require('fs'), path = require('path');
              const root = path.resolve(process.env.CLASSROOMS_DATA_DIR || path.join(process.cwd(),'data','classrooms'),id,'audio');
              let checked = 0, totalBytes = 0;
              const missing = [], unsupported = [];
              for (const scene of c?.scenes || []) for (const action of scene.actions || []) {
                if (action.type !== 'speech' || !action.audioUrl) continue;
                const prefix = '/api/classroom-media/'+id+'/audio/';
                const pathname = new URL(action.audioUrl,'https://localhost').pathname;
                const filename = pathname.startsWith(prefix) ? pathname.slice(prefix.length) : '';
                if (!/^[A-Za-z0-9_-]+\.(wav|mp3|ogg|aac)$/.test(filename)) {
                  unsupported.push({order:scene.order,speechId:action.id}); continue;
                }
                const file = path.resolve(root,filename);
                if (!file.startsWith(root+path.sep)) throw new Error('Invalid media path');
                try {
                  const stat = fs.statSync(file);
                  if (!stat.isFile() || stat.size <= 44) throw new Error('Empty audio');
                  checked++; totalBytes += stat.size;
                } catch {
                  missing.push({order:scene.order,speechId:action.id});
                }
              }
              console.log(JSON.stringify({check:'saved-audio-files',checked,totalBytes,missing,unsupported}));
            } finally {await pool.end();}
          })().catch(e=>{console.log(JSON.stringify({check:'metadata-failed',name:e.name}));process.exitCode=1;});
          NODE
          if [ "$SNAPSHOT" = true ]; then
            "${SSH[@]}" "docker exec agentic-teacher-prod cat '/tmp/classroom-snapshot-$GITHUB_RUN_ID.json'" > classroom-snapshot.json
            "${SSH[@]}" "docker exec agentic-teacher-prod rm -f '/tmp/classroom-snapshot-$GITHUB_RUN_ID.json'"
          fi
          "${SSH[@]}" 'docker logs --since 120m --tail 2000 agentic-teacher-prod 2>&1' | python3 -c '
          import sys,re,json
          lines=[]
          for line in sys.stdin:
              if not any(tag in line for tag in ("[Scene Content API]", "[Scene Actions API]", "[TTS API]")):continue
              line=re.sub(r"sk-[A-Za-z0-9._-]+", "[redacted]",line)
              line=re.sub(r"Bearer\s+[^\s\"\x27]+", "Bearer [redacted]",line)
              lines.append(line.strip()[:900])
          print(json.dumps({"check":"recent-generation-log", "lines":lines[-90:]},ensure_ascii=False))'
      - name: Preserve scoped classroom snapshot
        if: inputs.snapshot
        uses: actions/upload-artifact@v4
        with:
          name: classroom-generation-snapshot
          path: classroom-snapshot.json
          retention-days: 3
