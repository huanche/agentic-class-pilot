name: Mainland Web Deployer Tests

on:
  pull_request:
    paths:
      - 'scripts/mainland/agentic-web-deploy'
      - 'scripts/mainland/test-web-release.py'
      - 'scripts/mainland/agentic-mainland-backup'
      - 'scripts/mainland/test-backup-window.py'
      - '.github/workflows/mainland-web-deployer-tests.yml'
  push:
    paths:
      - 'scripts/mainland/agentic-web-deploy'
      - 'scripts/mainland/test-web-release.py'
      - 'scripts/mainland/agentic-mainland-backup'
      - 'scripts/mainland/test-backup-window.py'
      - '.github/workflows/mainland-web-deployer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployer-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise deployer with isolated files and fake services
        run: |
          sudo python3 scripts/mainland/test-web-release.py
          python3 scripts/mainland/test-backup-window.py
