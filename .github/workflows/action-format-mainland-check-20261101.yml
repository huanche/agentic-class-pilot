name: action-format-mainland-check-20261101
on:
  push:
    branches: [codex/backup-generation-controls-20261020]
    paths: [.github/workflows/action-format-mainland-check-20261101.yml]
permissions:
  contents: read
concurrency:
  group: mainland-teacher-observe
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current mainland teacher image and health through restricted SSH
        env:
          SERVER_HOST: ${{ secrets.MAINLAND_SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.MAINLAND_SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.MAINLAND_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "$SERVER_HOST" = '43.138.178.158'
          DIR=$(mktemp -d)
          trap 'rm -rf -- "$DIR"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$DIR/key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$DIR/known_hosts"
          ssh-keygen -y -f "$DIR/key" >/dev/null
          ssh -F /dev/null -T -i "$DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$DIR/known_hosts" -o ConnectTimeout=15 "agentic-ci@$SERVER_HOST" teacher-check
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 -D "$DIR/headers" -o "$DIR/health" https://agenticclasspilot.com/teacher/api/health
          grep -qi '^x-agentic-backend: mainland' "$DIR/headers"
          python3 - "$DIR/health" <<'PYHEALTH'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['status']=='ok'
          assert data['capabilities']['tts'] is True
          print('VERIFY_MAINLAND_HEALTH=200; TTS=enabled')
          PYHEALTH
