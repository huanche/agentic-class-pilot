name: student-deploy

# Student-agent deployment: PRs to main that touch student_agent/** get a
# build-only check (npm ci + static export) so breakage surfaces before merge.
# Pushes to main additionally SSH to the production server and run the
# server-side deploy script: ff-only pull -> rebuild frontend -> swap static
# bundle -> restart agentic-student, with health check + automatic rollback
# (see student_agent/scripts/server-deploy-student.sh).
#
# Reuses the teacher-deploy secrets:
#   SERVER_HOST     43.132.155.8
#   SERVER_SSH_KEY  dedicated ed25519 private key (github-actions-teacher-deploy)
#
# One-time server prerequisite (CI ssh sessions are non-interactive):
#   ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl restart agentic-student
#
# Rationale: teacher changes deploy automatically via teacher-deploy CI, but
# student_agent/** triggered nothing — the served static bundle silently went
# stale (2026-10-10 "fullscreen button missing" incident: code was on main
# for a day while production kept serving the previous build). This workflow
# closes that gap; the build-fingerprint guard (write-build-fingerprint.mjs)
# remains the runtime tripwire.

on:
  push:
    branches: [main]
    paths:
      - 'student_agent/**'
      - '.github/workflows/student-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'student_agent/**'
      - '.github/workflows/student-deploy.yml'
  workflow_dispatch:

concurrency:
  group: student-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student_agent/frontend/package-lock.json

      - name: Build frontend (static export + fingerprint)
        working-directory: student_agent/frontend
        run: |
          npm ci
          npm run build

  deploy:
    # PR builds stop after the build check; only main pushes / manual runs deploy.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SERVER_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new ubuntu@$SERVER_HOST"

          # Upload the server-side deploy script (strip CR in case of CRLF checkout).
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new \
            student_agent/scripts/server-deploy-student.sh \
            "ubuntu@$SERVER_HOST:/tmp/server-deploy-student.sh"
          $SSH "sed -i 's/\r$//' /tmp/server-deploy-student.sh"

          $SSH "bash /tmp/server-deploy-student.sh '$GITHUB_SHA'"

      # Informational only — the authoritative gate is the server-side health
      # check + rollback in server-deploy-student.sh.
      - name: Verify public endpoint
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            https://agenticclasspilot.com/api/session/health || true)
          echo "public /api/session/health -> $code"
