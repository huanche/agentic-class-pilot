name: Mainland Teacher Release

on:
  workflow_run:
    workflows: [teacher-deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful teacher-deploy build run on main (not a PR run)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mainland-teacher-operations
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify trusted build and reject superseded teacher code
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/source-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/teacher-deploy.yml" and
            .head_branch == "main" and .head_repository.full_name == $repo and
            (.event == "push" or .event == "workflow_dispatch") and .status == "completed"
          ' /tmp/source-run.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" |
            jq -e 'any(.jobs[]; .name == "build" and .conclusion == "success")' >/dev/null
          SHA=$(jq -r .head_sha /tmp/source-run.json)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SHA" origin/main
          git diff --exit-code "$SHA" origin/main -- teacher_agent/ scripts/mainland/ .github/workflows/mainland-teacher-release.yml
          git checkout --detach "$SHA"
          echo "SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=main-${SHA:0:7}" >> "$GITHUB_ENV"

      - name: Verify media contracts
        run: node --test teacher_agent/services/classroom-video/readiness.test.mjs teacher_agent/services/onlyoffice/server.test.mjs

      - name: Prepare teacher and changed media images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          SERVER_HOST: ${{ secrets.MAINLAND_SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.MAINLAND_SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.MAINLAND_SSH_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
          AUTODEPLOY: ${{ vars.MAINLAND_AUTODEPLOY_ENABLED }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "$SERVER_HOST" = '43.138.178.158'
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN TCR_USERNAME TCR_PASSWORD SERVER_SSH_KEY SERVER_KNOWN_HOSTS; do
            test -n "${!name}"
          done
          DIR=$(mktemp -d)
          trap 'rm -rf -- "$DIR"' EXIT
          export DOCKER_CONFIG="$DIR/docker"
          mkdir -m 700 "$DOCKER_CONFIG"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin >/dev/null
          SOURCE="zmzm1443/agentic-teacher:$IMAGE_TAG"
          TARGET="ccr.ccs.tencentyun.com/agentedu-mainland/agentic-teacher:$IMAGE_TAG"
          docker pull --platform linux/amd64 "$SOURCE"
          export IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$SOURCE")
          for attempt in 1 2 3; do
            if printf '%s' "$TCR_PASSWORD" | timeout 60s docker login ccr.ccs.tencentyun.com -u "$TCR_USERNAME" --password-stdin >/dev/null; then break; fi
            if [[ "$attempt" = 3 ]]; then exit 1; fi
            echo "TCR login unavailable; retry $attempt/3 in 5 seconds"
            sleep 5
          done
          printf '%s\n' "$SERVER_SSH_KEY" > "$DIR/key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$DIR/known_hosts"
          ssh-keygen -y -f "$DIR/key" >/dev/null
          ssh-keygen -F "$SERVER_HOST" -f "$DIR/known_hosts" >/dev/null
          SSH=(ssh -F /dev/null -T -i "$DIR/key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o UserKnownHostsFile="$DIR/known_hosts" -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          push_tcr() {
            local image="$1" attempt
            for attempt in 1 2 3; do
              if timeout 1200s docker push "$image"; then return; fi
              [[ "$attempt" != 3 ]] || return 1
              sleep 10
            done
          }
          prepare() {
            local tag="$1" image_id="$2" command="$3"
            RELEASE_TAG="$tag" RELEASE_IMAGE="$image_id" python3 - <<'PY' |
          import json, os
          print(json.dumps({
            'tag': os.environ['RELEASE_TAG'], 'image_id': os.environ['RELEASE_IMAGE'],
            'username': os.environ['TCR_USERNAME'], 'password': os.environ['TCR_PASSWORD'],
          }))
          PY
              timeout 1440s "${SSH[@]}" "agentic-ci@$SERVER_HOST" "$command"
          }

          declare -A desired current
          while IFS='=' read -r service revision; do desired[$service]=$revision; done < <(bash scripts/mainland/teacher-media-revisions "$SOURCE_SHA")
          "${SSH[@]}" "agentic-ci@$SERVER_HOST" teacher-media-state > "$DIR/media-state"
          while IFS='=' read -r service revision; do
            [[ "$service" == video || "$service" == office ]] || exit 1
            [[ "$revision" == - || "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
            current[$service]=$revision
          done < "$DIR/media-state"
          for service in video office; do
            fingerprint="${desired[$service]}"
            [[ "$fingerprint" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$fingerprint" == "${current[$service]}" ]]; then
              echo "Keeping $service at $fingerprint"
              continue
            fi
            context=teacher_agent/services/onlyoffice
            [[ "$service" != video ]] || context=teacher_agent/services/classroom-video
            media_tag="$service-$fingerprint"
            image="ccr.ccs.tencentyun.com/agentedu-mainland/agentic-teacher:$media_tag"
            docker build --platform linux/amd64 --tag "$image" \
              --label "org.opencontainers.image.revision=$SOURCE_SHA" "$context"
            if [[ "$service" == video ]]; then
              python3 scripts/mainland/smoke-video-worker.py "$image"
            else
              docker run --rm --network none --entrypoint node \
                --mount "type=bind,source=$PWD/$context/server.test.mjs,target=/app/native-player/server.test.mjs,readonly" \
                "$image" --test /app/native-player/server.test.mjs
            fi
            push_tcr "$image"
            prepare "$media_tag" "$(docker image inspect -f '{{.Id}}' "$image")" teacher-media-prepare
          done

          docker tag "$SOURCE" "$TARGET"
          push_tcr "$TARGET"
          prepare "$IMAGE_TAG" "$IMAGE_ID" teacher-prepare
          "${SSH[@]}" "agentic-ci@$SERVER_HOST" teacher-check
          if [[ "$AUTODEPLOY" != true ]]; then
            echo '### Image verified on mainland; deployment remains disabled' >> "$GITHUB_STEP_SUMMARY"
            echo "Prepared $TARGET ($IMAGE_ID)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Re-fetch after potentially slow uploads. A later teacher change invalidates this release.
          git fetch origin main
          git diff --exit-code "$SOURCE_SHA" origin/main -- teacher_agent/ scripts/mainland/ .github/workflows/mainland-teacher-release.yml
          timeout 2400s "${SSH[@]}" "agentic-ci@$SERVER_HOST" "teacher-deploy-v3 $IMAGE_TAG ${desired[video]} ${desired[office]}"
          echo "### Deployed $TARGET ($IMAGE_ID)" >> "$GITHUB_STEP_SUMMARY"
