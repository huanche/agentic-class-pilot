name: hojo-deploy
on:
  pull_request:
    branches: [main]
    paths:
      - 'teacher_agent/devtools/hojo-local/**'
      - 'teacher_agent/scripts/server-deploy-hojo.sh'
      - '.github/workflows/hojo-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'teacher-deploy' || format('hojo-build-{0}', github.ref) }}
  cancel-in-progress: false
env:
  IMAGE: zmzm1443/agentic-teacher
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: echo "HOJO_TAG=hojo-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: teacher_agent/devtools/hojo-local
          push: ${{ github.event_name == 'workflow_dispatch' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.HOJO_TAG }}
          cache-from: type=gha,scope=hojo-cpu
          cache-to: type=gha,mode=max,scope=hojo-cpu
      - name: Validate both models in the production resource limits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/hojo-runtime"
          mkdir -p "$runtime"
          docker run -d --name hojo-ci --network host --user "$(id -u):$(id -g)" \
            --cpus=0.75 --memory=1536m --memory-swap=2560m --pids-limit=128 \
            --read-only --tmpfs /tmp:rw,nosuid,size=256m \
            -v "$runtime:/runtime" "$IMAGE:$HOJO_TAG"
          trap 'docker logs --tail 15 hojo-ci; docker rm -f hojo-ci >/dev/null' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:13306/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = 1 ]
          docker exec -i hojo-ci python - < teacher_agent/devtools/hojo-local/smoke.py
          [ "$(docker inspect hojo-ci --format '{{.RestartCount}}')" = 0 ]
          [ "$(docker inspect hojo-ci --format '{{.State.OOMKilled}}')" = false ]
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install optional Hojo without changing Kokoro
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/hojo-deploy-key"
          printf '%s\n' "$SERVER_SSH_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          SSH=(ssh -i "$key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=3 "ubuntu@$SERVER_HOST")
          SCP=(scp -i "$key" -o StrictHostKeyChecking=accept-new)
          "${SCP[@]}" teacher_agent/scripts/server-deploy-hojo.sh teacher_agent/scripts/server-deploy-teacher.sh teacher_agent/scripts/server-wait-teacher-idle.sh "ubuntu@$SERVER_HOST:/tmp/"
          "${SCP[@]}" teacher_agent/devtools/hojo-local/smoke.py "ubuntu@$SERVER_HOST:/tmp/hojo-smoke.py"
          "${SSH[@]}" "sed -i 's/\r$//' /tmp/server-deploy-hojo.sh /tmp/server-deploy-teacher.sh /tmp/server-wait-teacher-idle.sh /tmp/hojo-smoke.py"
          printf '%s' "$DOCKERHUB_TOKEN" | "${SSH[@]}" "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"
          "${SSH[@]}" "bash /tmp/server-wait-teacher-idle.sh && bash /tmp/server-deploy-hojo.sh '$IMAGE' 'hojo-${GITHUB_SHA::7}'"
