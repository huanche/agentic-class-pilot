name: pptx-content-scan-20261020
on:
  push:
    branches: [codex/backup-generation-controls-20261020]
    paths: [.github/workflows/pptx-content-scan-20261020.yml]
permissions:
  contents: read
concurrency:
  group: pptx-text-readonly-scan
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Diagnose or repair the PPTX asset route
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/pptx-route-key"
          printf '%s\n' "$SERVER_SSH_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          ssh -i "$key" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=3 "ubuntu@$SERVER_HOST" "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          printf '%s' '' | base64 -d | gzip -d | bash
          REMOTE
