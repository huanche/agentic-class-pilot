name: server-diagnostics

on:
  workflow_dispatch:
    inputs:
      reclaimBuildCache:
        description: Reclaim unused Docker build cache older than seven days
        type: boolean
        required: false
        default: false
  push:
    branches: [codex/course-duration-budget]
    paths: [.github/workflows/server-diagnostics.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reclaim old unused build cache without touching images or volumes
        if: ${{ inputs.reclaimBuildCache == true }}
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SERVER_SSH_KEY" > /tmp/maintenance_key
          chmod 600 /tmp/maintenance_key
          ssh -i /tmp/maintenance_key -o StrictHostKeyChecking=accept-new "ubuntu@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -eu
          df -P /
          docker builder prune --force --filter until=168h
          df -P /
          # PostgreSQL retries recovery itself once writable space is available.
          for attempt in $(seq 1 15); do
            if docker exec agentedu-final-database-1 pg_isready; then exit 0; fi
            sleep 4
          done
          echo 'Database still not ready after cache reclamation; no database files were changed by this script.'
          exit 1
          REMOTE
      - name: Inspect service readiness without changing data
        if: always()
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SERVER_SSH_KEY" > /tmp/diagnostic_key
          chmod 600 /tmp/diagnostic_key
          ssh -i /tmp/diagnostic_key -o StrictHostKeyChecking=accept-new "ubuntu@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo '--- disk space ---'
          df -P / /home/ubuntu
          echo '--- memory ---'
          free -m
          echo '--- containers ---'
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}'
          echo '--- database readiness ---'
          for database in $(docker ps -a --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /postgres/ { print $1 }'); do
            echo "database=$database"
            docker inspect "$database" --format 'state={{.State.Status}} restarting={{.State.Restarting}} oom={{.State.OOMKilled}} restartCount={{.RestartCount}}'
            docker exec "$database" pg_isready || true
            # Return categories only. Never publish SQL, credentials or raw application logs.
            docker logs --tail 300 "$database" 2>&1 | python3 -c 'import sys,json; text=sys.stdin.read().lower(); patterns={"disk_full":"no space left on device", "out_of_memory":"out of memory", "permission_denied":"permission denied", "ready":"ready to accept connections", "recovery":"recovery", "invalid_checkpoint":"invalid checkpoint", "missing_wal":"could not locate a valid checkpoint", "startup":"starting up", "invalid_record":"invalid record length", "panic":"panic", "fatal":"fatal", "lock_exists":"lock file", "shutdown":"shutdown"}; print(json.dumps({"log_category_counts": {key:text.count(value) for key,value in patterns.items()}}))'
          done
          echo '--- Docker disk usage ---'
          docker system df
          echo '--- recent generation event counts (no content or credentials) ---'
          docker logs --since 30m --tail 3000 agentic-teacher-prod 2>&1 | python3 -c 'import sys,json,re; patterns={"content_started":"Generating content", "content_ready":"Content generated successfully", "actions_started":"Generating actions:", "actions_ready":"actions for:", "scene_ready":"Scene built successfully", "tts_started":"Generating TTS", "tts_ready":"TTS generated", "tts_failed":"TTS generation failed", "llm_timeout":"LLM request timed out", "validation_retry":"Validation failed", "generation_error":"Failed to generate", "http_timeout":"504 Gateway"}; events=[]; counts={key:0 for key in patterns}; lines=sys.stdin.read().splitlines(); [(counts.__setitem__(key,counts[key]+1),events.append({"time":(re.search(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z",line).group(0) if re.search(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z",line) else None),"event":key})) for line in lines for key,value in patterns.items() if value in line]; print(json.dumps({"generation_counts":counts,"recent_events":events[-40:]}))'
          echo '--- host database services ---'
          echo '--- test introduction request timeline (only fixed test title) ---'
          docker logs --since 30m --tail 3000 agentic-teacher-prod 2>&1 | python3 -c 'import sys,json,re; rows=[]; [(rows.append({"time":re.search(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z",line).group(0),"event":key})) for line in sys.stdin.read().splitlines() if "课程导入与学习目标" in line for key,value in {"content_start":"Generating content", "content_ready":"Content generated successfully", "actions_start":"Generating actions:", "actions_ready":"actions for:"}.items() if value in line and re.search(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z",line)]; print(json.dumps(rows))'
          systemctl list-units --all --no-pager 'postgresql*' || true
          if command -v pg_lsclusters >/dev/null 2>&1; then pg_lsclusters; fi
          REMOTE
