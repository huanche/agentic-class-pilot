name: verify-kokoro-release
on:
  push:
    branches: [codex/cloud-kokoro-verification-20261018]
    paths: [.github/workflows/verify-kokoro-release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed service and real teacher TTS requests
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/kokoro-verify-key"
          printf '%s\n' "$SERVER_SSH_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          ssh -i "$key" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=3 "ubuntu@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker inspect agentic-kokoro --format 'ttsState={{.State.Status}} ttsOOMKilled={{.State.OOMKilled}} restartCount={{.RestartCount}} memoryLimit={{.HostConfig.Memory}}'
          docker events --since 15m --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --filter container=agentic-kokoro --filter event=oom --filter event=die --format 'ttsEvent={{.Action}} exitCode={{index .Actor.Attributes "exitCode"}} time={{.Time}}'
          sudo -n dmesg --ctime | python3 -c 'import sys; lines=[line.strip() for line in sys.stdin if any(m in line for m in ("Memory cgroup out of memory", "oom-kill", "Killed process"))]; [print("kernelOOM="+line) for line in lines[-6:]]'
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}' agentic-teacher-prod agentic-kokoro
          docker exec agentic-kokoro sh -c 'for f in memory.current memory.peak memory.events; do if [ -f "/sys/fs/cgroup/$f" ]; then printf "%s=" "$f"; cat "/sys/fs/cgroup/$f"; fi; done'
          docker logs --tail 30 agentic-kokoro 2>&1 | python3 -c 'import json,sys; [print(line.strip()) for line in sys.stdin if line.strip().startswith("{") and any(marker in line for marker in ("synthesis_error", "ready", "speech", "http"))]'
          docker logs --since 8m agentic-teacher-prod 2>&1 | python3 -c 'import json,sys; data=sys.stdin.read(); print(json.dumps({marker:(marker in data) for marker in ("ECONNRESET","ECONNREFUSED","UND_ERR_SOCKET","fetch failed","bad allocation","out of memory","Lemonade TTS API error")}))'
          curl -fsS --max-time 5 http://127.0.0.1:13305/health
          REMOTE
