<html>
  <body style="font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; background:#f4f4f5; padding: 24px;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px;">
      <h2 style="margin: 0 0 16px; color: #18181b;">{{ project_name }} · 注册验证码</h2>
      <p style="color: #3f3f46; line-height: 1.6;">你好，你正在注册 {{ project_name }} 账号，本次验证码为：</p>
      <div style="text-align: center; margin: 24px 0;">
        <span style="display: inline-block; font-size: 32px; letter-spacing: 8px; font-weight: 700; color: #0f766e; background: #f0fdfa; border-radius: 8px; padding: 12px 24px;">{{ code }}</span>
      </div>
      <p style="color: #3f3f46; line-height: 1.6;">验证码 {{ valid_minutes }} 分钟内有效。如果这不是你的操作，请忽略本邮件。</p>
      <hr style="border: none; border-top: 1px solid #e4e4e7; margin: 24px 0;" />
      <p style="color: #a1a1aa; font-size: 12px;">本邮件由系统自动发送，请勿直接回复。</p>
    </div>
  </body>
</html>
