name: agentedu-final
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: education
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - final_database:/var/lib/postgresql/data
      - ./local-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d education"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mail:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    restart: unless-stopped
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agentedu}
      MINIO_ROOT_PASSWORD: ${TEACHER_DB_PASSWORD}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - final_minio:/data
    restart: unless-stopped
  gateway:
    image: caddy:2.10-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./deployment/Caddyfile.local:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  final_database:
  final_minio:
