<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生与 AI 聊天记录</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#243149;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1440px;margin:auto;padding:28px}header,.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}header{margin-bottom:18px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 12px}.hint{color:#66758a;font-size:13px}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px 13px;color:#243149}button:hover{background:#eef3f8}input,select{border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;background:#fff;min-width:0}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.filters>*{min-width:150px}.filters input{flex:1}.layout{display:grid;grid-template-columns:minmax(280px,370px) minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid #e1e6ee;border-radius:12px;padding:18px;min-height:430px}.list,.transcript{max-height:70vh;overflow:auto}.session{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px;border:1px solid #e1e6ee;border-radius:9px}.session.active{border-color:#346bd1;background:#eff5ff}.session strong,.session small{display:block}.session small{color:#66758a;line-height:1.5;margin-top:4px}.message{max-width:85%;margin:13px 0;padding:12px 15px;border-radius:12px;background:#f0f4f8;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.message.student{margin-left:auto;background:#e9f1ff}.meta{font-size:12px;color:#5d6d84;margin-bottom:5px}.phase{display:inline-block;background:#e1e8f0;border-radius:5px;padding:2px 6px;margin-left:6px}.empty{color:#66758a;padding:35px 8px;text-align:center}.error{color:#a52336}#summary{margin:0 0 10px}@media(max-width:780px){.wrap{padding:15px}.layout{grid-template-columns:1fr}.panel{min-height:180px}.list,.transcript{max-height:55vh}}
  </style>
</head>
<body>
<main class="wrap">
  <header><div><h1>学生与 AI 聊天记录</h1><div class="hint">本地查看 · 只读 · 手动刷新</div></div><button id="refresh">刷新记录</button></header>
  <form id="login" class="filters"><input id="origin" type="url" required placeholder="平台网址，例如 https://…" aria-label="平台网址"><input id="username" type="email" required autocomplete="username" placeholder="教师邮箱" aria-label="教师邮箱"><input id="password" type="password" required autocomplete="current-password" placeholder="密码" aria-label="密码"><button type="submit">登录并读取</button></form>
  <div class="filters"><select id="course" aria-label="课程"><option value="">选择课程</option></select><select id="student" aria-label="学生"><option value="">全部学生</option></select><select id="lesson" aria-label="课时"><option value="">全部课时</option></select><input id="search" aria-label="搜索" placeholder="搜索学生、课时或聊天内容"><select id="phase" aria-label="阶段"><option value="">全部阶段</option></select></div>
  <div class="layout"><section class="panel"><div class="topline"><h2>会话</h2><span id="count" class="hint"></span></div><div id="sessions" class="list empty">请先登录教师账号</div></section><section class="panel"><h2 id="title">聊天内容</h2><p id="summary" class="hint"></p><div id="messages" class="transcript empty">选择左侧会话查看记录</div></section></div><p id="status" class="hint" role="status"></p>
</main>
<script>
const base='/api/v1/teacher-chat-records', $=id=>document.getElementById(id);let sessions=[],messages=[],selected=null,loadToken=0;
const labels={recall:'初始复述',reinforce:'加强复述',discuss:'深入讨论',wrapup:'课堂总结',postclass:'课后对话',discussion:'复述与讨论',video:'视频',done:'已结束',replay:'回看'};
const date=s=>s?new Date(s).toLocaleString('zh-CN'):'';const status=(s,error=false)=>{$('status').textContent=s;$('status').className=error?'hint error':'hint'};
function options(el,items,label){const old=el.value;el.replaceChildren(new Option(label,''),...items.map(x=>new Option(x.label,x.value)));el.value=items.some(x=>x.value===old)?old:''}
async function get(path){const r=await fetch(base+path,{cache:'no-store'});if(!r.ok){let detail='';try{detail=(await r.json()).detail}catch{}throw new Error(detail||`读取失败：HTTP ${r.status}`)}return r.json()}
async function loadCourses(){const rows=await get('/courses');options($('course'),rows.map(x=>({value:x.id,label:x.title})),'选择课程');if(rows.length===1)$('course').value=rows[0].id;await loadSessions()}
async function loadSessions(){const course=$('course').value;selected=null;messages=[];$('messages').textContent='选择左侧会话查看记录';$('title').textContent='聊天内容';$('summary').textContent='';if(!course){sessions=[];renderSessions();return}try{status('正在读取…');sessions=await get(`/courses/${encodeURIComponent(course)}/sessions`);options($('student'),[...new Map(sessions.map(s=>[s.studentId,{value:s.studentId,label:s.student}])).values()],'全部学生');options($('lesson'),[...new Map(sessions.map(s=>[(s.lessonId||s.classroomId),{value:s.lessonId||s.classroomId,label:s.lesson}])).values()],'全部课时');renderSessions();status(`已读取 ${sessions.length} 个会话 · ${date(new Date())}`)}catch(e){status(e.message,true)}}
function renderSessions(){const q=$('search').value.trim().toLowerCase(),student=$('student').value,lesson=$('lesson').value;const rows=sessions.filter(s=>(!student||s.studentId===student)&&(!lesson||(s.lessonId||s.classroomId)===lesson)&&(!q||`${s.student} ${s.lesson}`.toLowerCase().includes(q)||(s.sessionKey===selected&&messages.some(m=>m.content.toLowerCase().includes(q)))));$('count').textContent=`${rows.length} / ${sessions.length}`;const box=$('sessions');box.className='list';box.replaceChildren();if(!rows.length){box.className='list empty';box.textContent='没有符合条件的会话';return}for(const s of rows){const b=document.createElement('button');b.className='session'+(selected===s.sessionKey?' active':'');b.innerHTML=`<strong></strong><small></small>`;b.querySelector('strong').textContent=s.student;b.querySelector('small').textContent=`${s.lesson} · ${date(s.lastActiveAt)} · ${s.messageCount} 条消息`;b.onclick=()=>loadMessages(s);box.append(b)}}
async function loadMessages(s){selected=s.sessionKey;const token=++loadToken;renderSessions();$('title').textContent=`${s.student} · ${s.lesson}`;$('summary').textContent=`开始 ${date(s.startedAt)} · 最近活动 ${date(s.lastActiveAt)} · ${s.ended?'已结束':'进行中'}`;$('messages').textContent='正在读取聊天内容…';try{messages=await get(`/courses/${encodeURIComponent($('course').value)}/sessions/${encodeURIComponent(s.sessionKey)}/messages`);if(token!==loadToken)return;options($('phase'),[...new Set(messages.map(m=>m.phase).filter(Boolean))].map(p=>({value:p,label:labels[p]||p})),'全部阶段');renderMessages();status(`已读取 ${messages.length} 条消息 · ${date(new Date())}`)}catch(e){if(token===loadToken){$('messages').textContent=e.message;status(e.message,true)}}}
function renderMessages(){const box=$('messages'),phase=$('phase').value,q=$('search').value.trim().toLowerCase(),rows=messages.filter(m=>(!phase||m.phase===phase)&&(!q||m.content.toLowerCase().includes(q)));box.className='transcript';box.replaceChildren();if(!rows.length){box.className='transcript empty';box.textContent='这个筛选条件下没有消息';return}for(const m of rows){const article=document.createElement('article'),meta=document.createElement('div'),body=document.createElement('div');article.className='message'+(m.role==='student'||m.role==='user'?' student':'');meta.className='meta';meta.textContent=`${m.role==='student'||m.role==='user'?'学生':'AI'} · ${date(m.createdAt)}`;if(m.phase){const badge=document.createElement('span');badge.className='phase';badge.textContent=labels[m.phase]||m.phase;meta.append(badge)}body.textContent=m.content;article.append(meta,body);box.append(article)}}
$('login').onsubmit=async e=>{e.preventDefault();status('正在登录…');try{const r=await fetch(base+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:$('origin').value,username:$('username').value,password:$('password').value})});$('password').value='';if(!r.ok)throw new Error((await r.json()).detail||`登录失败：HTTP ${r.status}`);localStorage.setItem('chatViewerOrigin',$('origin').value);status('登录成功');await loadCourses()}catch(error){status(error.message,true)}};$('origin').value=localStorage.getItem('chatViewerOrigin')||'https://agenticclasspilot.com';$('course').onchange=loadSessions;$('student').onchange=renderSessions;$('lesson').onchange=renderSessions;$('phase').onchange=renderMessages;$('search').oninput=()=>{renderSessions();renderMessages()};$('refresh').onclick=async()=>{const key=selected;await loadSessions();const row=sessions.find(s=>s.sessionKey===key);if(row)await loadMessages(row)};
</script>
</body>
</html>
